<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <button id="btn" onclick="aaa()">点击发请求</button>
  <div id="content"></div>

<script>
    async function aaa(){
        const res=await fetch("http://localhost:8000/test02",{
            method:"POST",
            headers: {"content-type":"application/json"},
            body:JSON.stringify({
                "query":"hh",
                "session_id":"111"
            })
        })
        const data=await res.json()
        console.log(data)

    const es = new EventSource("http://localhost:8000/sse/111")
        es.addEventListener("processing",function (e){
            document.getElementById("content").innerHTML+=e.data + "<br/>"
        })
        es.addEventListener("final",function (e){
            es.close()
        })
    }


</script>


</body>
</html>
