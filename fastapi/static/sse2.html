<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <button id="btn" onclick="aaa()">点击发请求</button>
  <div id="content"></div>

<script>
  async function aaa(){
      const res=await fetch("http://localhost:8000/test02",{
          method:"POST"
          ,headers:{
              "content-type":"application/json"
          },
          body:JSON.stringify({
              "query":"hhh",
              "session_id":"123"
          })
      })
      const res_str=await res.json()
      console.log(res_str)
      const es =new EventSource("http://localhost:8000/sse/123")
      es.onmessage=function (res){
          if (res.data==="None"){
              es.close()
          }
          else {
              document.getElementById("content").innerHTML+=res.data +"<br/>"
          }

      }
  }

</script>


</body>
</html>
